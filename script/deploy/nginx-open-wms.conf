# open-wms 生产环境 Nginx 参考配置
# 用法：替换 server_name、证书路径、前端目录、后端地址后 include 到 nginx.conf
#
# 说明：
# 1. 前端构建产物 dist/ 已带 .gz 预压缩文件，必须开启 gzip_static，不要再开 gzip 动态压缩
# 2. 前端使用 history 路由，需要 try_files 回退到 index.html
# 3. 后端默认端口 7861，前端所有接口走 /prod-api 前缀

server {
    listen 80;
    server_name wms.example.com;
    # 生产环境强制 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wms.example.com;

    ssl_certificate     /etc/nginx/ssl/wms.crt;
    ssl_certificate_key /etc/nginx/ssl/wms.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 前端静态资源
    root /opt/open-wms-ui/dist;
    index index.html;

    # 预压缩产物，直接返回 .gz
    gzip_static on;
    gzip_vary on;

    # 带 hash 的静态资源长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口
    location /prod-api/ {
        proxy_pass http://127.0.0.1:7861/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（消息通知）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 文件上传：与后端 spring.servlet.multipart 限制保持一致
        client_max_body_size 100m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查（供负载均衡/监控探活）
    location = /actuator/health {
        proxy_pass http://127.0.0.1:7861/actuator/health;
        access_log off;
    }

    # 其余 actuator 与接口文档一律不对外
    location ~ ^/(actuator|v3/api-docs|swagger-ui) {
        return 404;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
